[workspace]
resolver = "3"
members = [
    "crates/content",
    "crates/weapons",
    "crates/kv",
    "crates/vpk",
    "crates/vfs",
    "crates/bsp",
    "crates/vtf",
    "crates/vmt",
    "crates/mdl",
    "crates/character-pose",
    "crates/collision",
    "crates/movement",
    "crates/nav",
    "crates/sim",
    "crates/netcode",
    "crates/server",
    "crates/level",
    "crates/scaleform",
    "crates/client",
    "crates/ragdoll",
    "crates/launcher",
    "crates/workshop",
    "crates/packs",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Mr. Claude (Anthropic's Claude)"]
repository = "https://github.com/"

[workspace.dependencies]
# Kept on the same versions as COD-Legacy-Mashup (IW4L) so the two runtimes can
# share one Bevy app when the games are stitched together.
bevy = { version = "0.19", default-features = false, features = [
    "bevy_window",
    "bevy_state",
    "bevy_winit",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_text",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_log",
    "bevy_asset",
    "multi_threaded",
    "default_font",
    "png",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_audio",
    "wav",
    "mp3",
    "vorbis",
] }
glam = { version = "0.32.1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# Same versions velopack already pulls in (HTTP, hashes, JSON).
ureq = "3"
sha1 = "0.11"
serde_json = "1"
lzma-rs = "0.3"
bcdec_rs = "0.2"

content = { path = "crates/content" }
kv = { path = "crates/kv" }
vpk = { path = "crates/vpk" }
vfs = { path = "crates/vfs" }
bsp = { path = "crates/bsp" }
vtf = { path = "crates/vtf" }
vmt = { path = "crates/vmt" }
mdl = { path = "crates/mdl" }
character-pose = { path = "crates/character-pose" }
collision = { path = "crates/collision" }
movement = { path = "crates/movement" }
sim = { path = "crates/sim" }
netcode = { path = "crates/netcode" }
nav = { path = "crates/nav" }
level = { path = "crates/level" }
weapons = { path = "crates/weapons" }
scaleform = { path = "crates/scaleform" }
client = { path = "crates/client" }
workshop = { path = "crates/workshop" }
packs = { path = "crates/packs" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Desktop tools link both render stacks and cosmetic physics. Full CodeView
# symbols exceed MSVC's PDB limit in installed-data examples (LNK1140).
# Keep symbols for the small sim/format crates; desktop checks need no PDB.
[profile.dev.package.launcher]
debug = 0

[profile.dev.package.client]
debug = 0

# Day-to-day playable build: optimised, fast to link.
[profile.play]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[profile.release]
lto = "thin"
