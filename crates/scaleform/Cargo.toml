[package]
name = "scaleform"
description = "Plays CS:GO's Scaleform UI movies from the player's install with Ruffle"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
kv.workspace = true
vfs.workspace = true
# Ruffle is not on crates.io. Our fork's `csgo-scaleform` branch: upstream
# ba92d5af (2026-10-11) plus ImportAssets/duplicateMovieClip fixes and opt-in
# diagnostics. Keep both packages on the same immutable reviewed revision
# (docs/research/ruffle-import-aliases.md).
ruffle_core = { git = "https://github.com/bentsignal/ruffle", rev = "102b2f3c929cdb1fdfd14fd70f9f149120192387", features = ["default_font"] }
ruffle_render_wgpu = { git = "https://github.com/bentsignal/ruffle", rev = "102b2f3c929cdb1fdfd14fd70f9f149120192387" }
# AS2 compiler (Ruffle uses it for its own AVM1 globals); compiles our bridge shim.
rascal = "0.3.5"
futures = "0.3"
async-channel = "2.5"
encoding_rs = "0.8"
url = "2"
tracing = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"

[dev-dependencies]
serde_json.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
