[package]
name = "launcher"
description = "CSGO Rewrite entry point (binary: csr)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "csr"
path = "src/main.rs"

[dependencies]
kv.workspace = true
vpk.workspace = true
vfs.workspace = true
bsp.workspace = true
vtf.workspace = true
vmt.workspace = true
mdl.workspace = true
glam.workspace = true
collision.workspace = true
movement.workspace = true
sim.workspace = true
level.workspace = true
client.workspace = true
weapons.workspace = true
workshop.workspace = true
packs.workspace = true
# Installer and self-update from GitHub Releases (keep in step with the
# `vpk` packer version in tools/package-release.ps1).
velopack = "=1.2.161"
# Original Steam library artwork and the app icon, drawn in code.
png = "0.18"
crc32fast = "1"
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
png = "0.18"

[dev-dependencies]
rodio = { version = "0.22", default-features = false, features = ["hound", "mp3"] }
