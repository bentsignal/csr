[package]
name = "client"
description = "Bevy renderer, input and HUD for CSGO Rewrite"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Private CPU attribution only; never enabled by the normal release build.
targeted-render-trace = ["bevy/trace", "bevy/debug", "dep:tracing", "dep:tracing-subscriber"]
# Hardware smoke remains opt-in; desktop releases keep their existing renderer.
xr-smoke = ["dep:bevy_mod_openxr", "dep:bevy_mod_xr", "dep:openxr"]

[[example]]
name = "xr_smoke"
path = "examples/xr_smoke.rs"
required-features = ["xr-smoke"]

[dependencies]
mechanics.workspace = true
bevy.workspace = true
tracing = { version = "=0.1.44", optional = true, default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", optional = true, default-features = false, features = ["registry", "std"] }
glam.workspace = true
kv.workspace = true
weapons.workspace = true
vfs.workspace = true
bsp.workspace = true
vtf.workspace = true
vmt.workspace = true
mdl.workspace = true
character-pose.workspace = true
collision.workspace = true
movement.workspace = true
sim.workspace = true
netcode.workspace = true
level.workspace = true
content.workspace = true
packs.workspace = true
workshop.workspace = true
scaleform.workspace = true
sha2 = "0.10"
ragdoll = { path = "../ragdoll" }

image = { version = "0.25", default-features = false, features = ["png"] }
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
# Runtime-only installed equipment silhouettes; no SVG fonts or raster references.
resvg = { version = "=0.47.0", default-features = false }

# Same decoders enabled by Bevy audio; validate before Bevy's panic-on-error
# decoder, and inspect channel count for rodio's spatial downmix adapter.
rodio = { version = "0.22", default-features = false, features = ["hound", "mp3", "lewton"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
bevy_mod_openxr = { version = "=0.6.0", optional = true, default-features = false, features = ["vulkan", "window_support"] }
bevy_mod_xr = { version = "=0.6.0", optional = true, default-features = false }
openxr = { version = "=0.21.1", optional = true }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Input_XboxController", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
