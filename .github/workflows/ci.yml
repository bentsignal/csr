name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  no-game-assets:
    name: No game assets in the repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash tools/check-no-assets.sh

  test:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Tests use synthetic data. Ones that need a CS:GO install are #[ignore]d.
      - run: cargo test --workspace --locked
      # Same profile as the tests, so it reuses their build.
      - run: cargo build -p launcher --locked
