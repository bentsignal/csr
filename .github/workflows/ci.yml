name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CSR_BUILD_SHA: ${{ github.sha }}
  # Desktop links hold several GiB each; leave room for the owner's apps and
  # local development builds on the shared self-hosted machine.
  CARGO_BUILD_JOBS: 1
  # Persistent build cache on the self-hosted runner (outside the checkout,
  # which is cleaned between runs).
  CARGO_TARGET_DIR: S:\tools\csr-actions-runner\cargo-target

jobs:
  no-game-assets:
    name: No game assets in the repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash tools/check-no-assets.sh

  test:
    name: Build, test and check against CS:GO Legacy
    # The owner's PC (see docs/CI.md). Never run code from forks on it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, csr]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5
      - run: Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"
      - run: cargo test --workspace --locked
      - run: cargo test -p launcher --example movement_replay --locked
      - run: powershell -NoProfile -File tools/fidelity/with-native-slot.ps1
      - run: cargo build --profile play -p launcher --locked
      - name: Build asset-free Skate pack creator
        run: ./tools/build-skate-tools.ps1 -OutputDir (Join-Path $env:CARGO_TARGET_DIR 'skate-tools')
      # Real-data checks against the CS:GO Legacy install on the runner.
      - run: cargo run --profile play -p launcher --locked -- probe de_dust2
      - run: cargo run --profile play -p launcher --locked -- sim de_dust2
      - run: cargo run --profile play -p server --locked -- de_dust2 --netcheck --bots 2
      - run: cargo run --profile play -p server --locked -- de_dust2 --remotecheck --bots 2
      - run: cargo run --profile play -p server --locked -- de_dust2 --remotecheck --tickrate 64 --bots 2
