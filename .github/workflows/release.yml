name: Release

# Push a tag like v0.2.0 to build and publish a release. The version in the tag
# must match `version` in Cargo.toml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: D:\tools\csr-actions-runner\cargo-target

jobs:
  no-game-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash tools/check-no-assets.sh

  release:
    needs: no-game-assets
    runs-on: [self-hosted, csr]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5
      - run: cargo test --workspace --locked
      - name: Package
        run: ./tools/package-release.ps1
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist -Filter 'CSGO-Rewrite-*-windows-x64.zip' | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $zip.FullName --title "CSGO Rewrite $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep the zip (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: csgo-rewrite-windows-x64
          path: dist/CSGO-Rewrite-*-windows-x64.zip
