name: Release

# Push a tag like v0.2.0 to build and publish a release. The version in the tag
# must match `version` in Cargo.toml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash tools/check-no-assets.sh
        shell: bash
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: cargo test --workspace --locked
      - name: Package
        shell: pwsh
        run: ./tools/package-release.ps1
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/CSGO-Rewrite-*-windows-x64.zip \
            --title "CSGO Rewrite $GITHUB_REF_NAME" --generate-notes
      - name: Keep the zip (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: csgo-rewrite-windows-x64
          path: dist/CSGO-Rewrite-*-windows-x64.zip
