name: Release

# Push a tag like v0.2.0 to build and publish a release. The version in the tag
# must match `version` in Cargo.toml. The release carries the installer
# (CSGORewrite-win-Setup.exe), the full and delta update packages and the
# update feed (releases.win.json) that installed copies read, plus the
# portable zip.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: C:\tools\csr-actions-runner\cargo-target

jobs:
  no-game-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash tools/check-no-assets.sh

  release:
    needs: no-game-assets
    runs-on: [self-hosted, csr]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5
      - run: Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"
      - run: Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.dotnet\tools"
      - name: Velopack packer (vpk, same version as the velopack crate)
        run: |
          dotnet tool update -g vpk --version 1.2.161
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: cargo test --workspace --locked
      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
        # -DeltaFromGitHub fetches the previous release so updates can be deltas.
        run: ./tools/package-release.ps1 -DeltaFromGitHub
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist -Filter 'CSGO-Rewrite-*-windows-x64.zip' | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $zip.FullName --title "CSGO Rewrite $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Adds Setup.exe, the update packages and the feed to the same release.
          vpk upload github --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" --token $env:GH_TOKEN `
            --outputDir dist\velopack --tag $env:GITHUB_REF_NAME --releaseName "CSGO Rewrite $env:GITHUB_REF_NAME" --merge --publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep the zip and installer (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: csgo-rewrite-windows-x64
          path: |
            dist/CSGO-Rewrite-*-windows-x64.zip
            dist/velopack/*
